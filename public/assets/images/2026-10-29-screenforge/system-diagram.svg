<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1240" role="img" aria-labelledby="title description">
  <title id="title">ScreenForge system flow</title>
  <desc id="description">ScreenForge accepts a screenshot, sends it to Workers AI, stores the screenshot and generated page in R2, tracks jobs and share slugs in KV, and serves the page from an isolated Dynamic Worker with outbound networking disabled.</desc>
