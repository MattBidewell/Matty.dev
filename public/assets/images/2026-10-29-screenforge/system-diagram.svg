      <path d="M4 14h32M10 10.5h.1M14 10.5h.1M18 10.5h.1" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2.5" />
    </symbol>
    <symbol id="cloudflare-mark" viewBox="0 0 66 30">
      <path d="M53.1202 13.125c6.9965 0 12.6682 5.7084 12.6682 12.75 0 1.2552-.1802 2.4683-.5159 3.614-.0897.3077-.3753.511-.6945.511H46.953c-.2613 0-.4415-.2638-.3478-.5094l.3369-.8829c1.0769-2.8327 4.1467-5.1533 6.9873-5.2892l5.3844-.2775c.2877-.0148.5135-.2541.5135-.5439 0-.2884-.2235-.5269-.5094-.5438l-5.0563-.2993c-2.7182-.1392-4.046-2.5591-3.3154-5.0811l.8414-2.9024c.0856-.2952.3416-.5105.6466-.5267.2271-.0124.456-.0198.685-.0198Z" fill="#FF9910" />
