    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#565c56" />
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: #20231f; }
      .title { font-size: 30px; font-weight: 700; }
      .section { font-size: 22px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 650; }
      .detail { font-size: 14px; fill: #565c56; }
      .note-text { font-size: 14px; fill: #565c56; }
      .panel { fill: #f2f0e8; stroke: #d2d0c6; stroke-width: 2; }
      .node { fill: #fffdf7; stroke: #aeb2a8; stroke-width: 2; }
      .app-node { fill: #f2d3c7; stroke: #a63e27; stroke-width: 2; }
      .note { fill: #fffdf7; stroke: #d2d0c6; stroke-width: 1.5; }
      .service-icon { fill: #f48120; }
      .user-icon { color: #565c56; }
      .flow { fill: none; stroke: #565c56; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="1" y="1" width="898" height="1238" rx="8" fill="#f7f5ef" stroke="#d2d0c6" stroke-width="2" />
  <text class="title" x="30" y="48">ScreenForge system flow</text>
  <text class="detail" x="30" y="76">Screenshot in, shareable generated page out</text>
  <use href="#cloudflare-mark" x="820" y="24" width="48" height="22" />

  <rect class="panel" x="20" y="100" width="860" height="600" rx="8" />
  <text class="section" x="45" y="140">1. Generate and publish</text>

  <rect class="node" x="50" y="165" width="180" height="120" rx="6" />
  <use href="#browser-icon" class="user-icon" x="120" y="174" width="40" height="40" />
  <text class="label" x="140" y="231" text-anchor="middle">Uploader</text>
  <text class="detail" x="140" y="256" text-anchor="middle">Screenshot</text>

  <rect class="app-node" x="340" y="165" width="220" height="120" rx="6" />
  <use href="#workers-icon" class="service-icon" x="430" y="174" width="40" height="41" />
  <text class="label" x="450" y="231" text-anchor="middle">ScreenForge Worker</text>
  <text class="detail" x="450" y="256" text-anchor="middle">Upload · validate · publish</text>

  <rect class="node" x="670" y="165" width="180" height="120" rx="6" />
  <use href="#workers-ai-icon" class="service-icon" x="740" y="174" width="40" height="40" />
  <text class="label" x="760" y="231" text-anchor="middle">Workers AI</text>
  <text class="detail" x="760" y="256" text-anchor="middle">Structured site code</text>

  <path class="flow" d="M230 225H330" />
  <path class="flow" d="M560 207H660" />
  <path class="flow" d="M670 241H570" />

  <path class="flow" d="M450 285V320" />
  <path class="flow" d="M450 320H290V350" />
  <path class="flow" d="M450 320H610V350" />

  <rect class="node" x="160" y="360" width="260" height="120" rx="6" />
  <use href="#r2-icon" class="service-icon" x="178" y="395" width="46" height="46" />
  <text class="label" x="238" y="397">Cloudflare R2</text>
  <text class="detail" x="238" y="422">Uploads + snapshots</text>
  <text class="detail" x="238" y="446">Generated page bundle</text>

  <rect class="node" x="480" y="360" width="260" height="120" rx="6" />
  <use href="#kv-icon" class="service-icon" x="498" y="395" width="46" height="46" />
  <text class="label" x="558" y="397">Cloudflare KV</text>
  <text class="detail" x="558" y="422">Jobs + slug index</text>
  <text class="detail" x="558" y="446">Published site metadata</text>

  <path class="flow" d="M290 480V525" />
  <rect class="node" x="160" y="535" width="260" height="100" rx="6" />
  <use href="#workers-icon" class="service-icon" x="180" y="564" width="42" height="43" />
  <text class="label" x="238" y="577">Worker Loader</text>
  <text class="detail" x="238" y="601">Loads the saved page</text>

  <path class="flow" d="M420 585H470" />
  <rect class="app-node" x="480" y="535" width="260" height="100" rx="6" />
  <use href="#workers-icon" class="service-icon" x="500" y="564" width="42" height="43" />
  <text class="label" x="558" y="577">Dynamic Worker</text>
  <text class="detail" x="558" y="601">No outbound access</text>

  <rect class="note" x="270" y="652" width="360" height="32" rx="4" />
  <text class="note-text" x="450" y="673" text-anchor="middle">Share URL returned to uploader</text>

  <rect class="panel" x="20" y="720" width="860" height="500" rx="8" />
  <text class="section" x="45" y="760">2. Serve a shared page</text>

  <rect class="node" x="50" y="800" width="180" height="110" rx="6" />
  <use href="#browser-icon" class="user-icon" x="120" y="808" width="40" height="40" />
  <text class="label" x="140" y="866" text-anchor="middle">Visitor</text>
  <text class="detail" x="140" y="890" text-anchor="middle">Opens share URL</text>

  <rect class="app-node" x="340" y="800" width="220" height="110" rx="6" />
  <use href="#workers-icon" class="service-icon" x="430" y="807" width="40" height="41" />
  <text class="label" x="450" y="866" text-anchor="middle">ScreenForge Worker</text>
  <text class="detail" x="450" y="890" text-anchor="middle">Resolves slug · loads page</text>

  <path class="flow" d="M230 855H330" />
  <path class="flow" d="M560 825H660" />
  <path class="flow" d="M560 885C610 885 620 945 660 945" />

  <rect class="node" x="670" y="785" width="180" height="90" rx="6" />
  <use href="#kv-icon" class="service-icon" x="682" y="808" width="40" height="40" />
  <text class="label" x="732" y="829">KV</text>
  <text class="detail" x="732" y="852">Slug lookup</text>

  <rect class="node" x="670" y="900" width="180" height="90" rx="6" />
  <use href="#r2-icon" class="service-icon" x="682" y="923" width="40" height="40" />
  <text class="label" x="732" y="944">R2</text>
  <text class="detail" x="732" y="967">Page snapshot</text>

  <path class="flow" d="M450 910V1010" />
  <rect class="node" x="340" y="1020" width="220" height="90" rx="6" />
  <use href="#workers-icon" class="service-icon" x="354" y="1044" width="40" height="41" />
  <text class="label" x="408" y="1057">Worker Loader</text>
  <text class="detail" x="408" y="1080">Loads snapshot bundle</text>

  <path class="flow" d="M560 1065H660" />
  <rect class="app-node" x="670" y="1010" width="180" height="120" rx="6" />
  <use href="#workers-icon" class="service-icon" x="740" y="1018" width="40" height="41" />
  <text class="label" x="760" y="1077" text-anchor="middle">Dynamic Worker</text>
  <text class="detail" x="760" y="1101" text-anchor="middle">Returns page</text>
  <text class="detail" x="760" y="1120" text-anchor="middle">No outbound network</text>
</svg>
