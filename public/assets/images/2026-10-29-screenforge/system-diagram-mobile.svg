  <text class="detail" x="158" y="229">Website screenshot</text>
  <path class="flow" d="M300 255V287" />

  <rect class="app-node" x="70" y="295" width="460" height="96" rx="6" />
  <use href="#workers-icon" class="service-icon" x="94" y="320" width="44" height="45" />
