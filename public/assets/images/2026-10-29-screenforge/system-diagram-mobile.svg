  <text class="detail" x="386" y="817">Jobs + publish state</text>
  <text class="detail" x="386" y="843">Share slug index</text>

  <path class="flow" d="M158 866V907" />
  <rect class="node" x="45" y="916" width="245" height="86" rx="6" />
  <use href="#workers-icon" class="service-icon" x="61" y="937" width="42" height="43" />
  <text class="label" x="115" y="952">Worker Loader</text>
  <text class="detail" x="115" y="978">Loads page bundle</text>

  <path class="flow" d="M290 959H320" />
  <rect class="app-node" x="330" y="916" width="245" height="100" rx="6" />
  <use href="#workers-icon" class="service-icon" x="346" y="924" width="42" height="43" />
  <text class="label" x="452" y="976" text-anchor="middle">Dynamic Worker</text>
  <text class="detail" x="452" y="999" text-anchor="middle">No outbound access</text>

  <rect class="note" x="110" y="1040" width="380" height="36" rx="4" />
  <text class="note-text" x="300" y="1064" text-anchor="middle">Share URL returned to uploader</text>

  <rect class="panel" x="16" y="1130" width="568" height="710" rx="8" />
  <text class="section" x="36" y="1170">2. Serve a shared page</text>

  <rect class="node" x="70" y="1195" width="460" height="90" rx="6" />
  <use href="#browser-icon" class="user-icon" x="94" y="1219" width="42" height="42" />
