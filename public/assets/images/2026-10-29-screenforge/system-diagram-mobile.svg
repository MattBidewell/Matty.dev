  <text class="detail" x="158" y="506">Returns structured site code</text>
  <path class="flow" d="M300 535V572" />

  <rect class="app-node" x="70" y="580" width="460" height="90" rx="6" />
  <use href="#workers-icon" class="service-icon" x="94" y="602" width="44" height="45" />
  <text class="label" x="158" y="616">ScreenForge Worker</text>
  <text class="detail" x="158" y="645">Validates and assembles page</text>

