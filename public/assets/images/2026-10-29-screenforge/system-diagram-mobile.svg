  <text class="detail" x="115" y="1741">Loads page bundle</text>
  <path class="flow" d="M290 1721H320" />
  <rect class="app-node" x="330" y="1672" width="245" height="100" rx="6" />
  <use href="#workers-icon" class="service-icon" x="346" y="1680" width="42" height="43" />
  <text class="label" x="452" y="1732" text-anchor="middle">Dynamic Worker</text>
  <text class="detail" x="452" y="1755" text-anchor="middle">Page · no outbound</text>
