  <text class="detail" x="102" y="817">Uploads + snapshots</text>
  <text class="detail" x="102" y="843">Page bundle</text>

  <rect class="node" x="312" y="742" width="260" height="124" rx="6" />
  <use href="#kv-icon" class="service-icon" x="328" y="780" width="46" height="46" />
